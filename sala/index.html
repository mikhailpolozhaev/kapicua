<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unirse a Kapicúa</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#102118;color:#f6edd8;font-family:Arial,sans-serif}
 .card{width:min(520px,100%);padding:30px 24px;border:2px solid #d4af55;border-radius:18px;background:#173526;text-align:center}
h1{color:#d4af55}.code{margin:22px 0;padding:14px;border-radius:12px;background:#0e2519;border:1px solid #d4af55;font-size:1.45rem;font-weight:800;letter-spacing:.08em}
.btn{display:block;margin-top:12px;padding:14px;border-radius:12px;background:#d4af55;color:#182317;text-decoration:none;font-weight:800}
.btn.secondary{background:#1f5c3b;color:#fff}
.small{opacity:.8;font-size:.92rem}
</style>
</head>
<body>
<main class="card">
<h1>Kapicúa</h1>
<p>Te han invitado a una partida.</p>
<div class="code" id="room">—</div>
<a class="btn" id="open" href="#">Abrir Kapicúa</a>
<a class="btn secondary" id="android" href="https://play.google.com/store/apps/details?id=com.polozhaev.dominicandom">Descargar en Google Play</a>
<a class="btn secondary" id="ios" href="https://apps.apple.com/es/app/kapicua/6793445569">Descargar en App Store</a>
<p class="small">Si Kapicúa está instalada, el enlace de invitación debería abrir el juego directamente.</p>
</main>
<script>
const q=new URLSearchParams(location.search);
const room=(q.get("id")||"").trim();
const valid=/^[A-Za-z0-9_-]{1,64}$/.test(room);
const roomEl=document.getElementById("room");
const openEl=document.getElementById("open");
if(valid){
  roomEl.textContent=room;
  openEl.href="kapicua://sala/"+encodeURIComponent(room);
}else{
  roomEl.textContent="Código no válido";
  openEl.style.display="none";
}
const ua=navigator.userAgent||"";
if(/iPhone|iPad|iPod/i.test(ua)) document.getElementById("android").style.display="none";
if(/Android/i.test(ua)) document.getElementById("ios").style.display="none";
</script>
</body>
</html>
